<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="todo-container">

        <!-- Header -->
        <header class="header">

            <p class="subtitle">MY DAILY PLANNER</p>

            <h1>My To-Do List</h1>

            <p>
                Organize your tasks and get things done.
            </p>

        </header>


        <!-- Add Task Form -->
        <section class="add-task-section">

            <form id="task-form">

                <input
                    type="text"
                    id="task-input"
                    placeholder="What do you need to do?"
                    autocomplete="off"
                >

                <button type="submit" id="add-task-button">
                    Add Task
                </button>

            </form>

            <p id="input-error" class="error-message"></p>

        </section>


        <!-- Pending Tasks -->
        <section class="task-section">

            <div class="section-heading">

                <div>
                    <h2>Pending Tasks</h2>

                    <p id="pending-count">
                        0 pending
                    </p>
                </div>

            </div>


            <div id="pending-list" class="task-list">

                <!-- Pending tasks will be added here -->

            </div>

            <p id="pending-empty" class="empty-message">
                🎉 No pending tasks. You're all caught up!
            </p>

        </section>


        <!-- Completed Tasks -->
        <section class="task-section completed-section">

            <div class="section-heading">

                <div>
                    <h2>Completed Tasks</h2>

                    <p id="completed-count">
                        0 completed
                    </p>
                </div>

            </div>


            <div id="completed-list" class="task-list">

                <!-- Completed tasks will be added here -->

            </div>

            <p id="completed-empty" class="empty-message">
                No completed tasks yet. Finish a task to see it here.
            </p>

        </section>


        <!-- Footer -->
        <footer>
            <p>Stay organized. Stay productive. ✨</p>
        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
